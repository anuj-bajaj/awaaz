<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffd400">
<title>Awaaz - Campus Voice Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Rozha+One&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ecece6;--ink:#141414;--white:#fff;--soft:#f1f1ec;
  --yellow:#ffd400;--critical:#e8283a;--high:#f27a0d;--medium:#ffc800;--low:#22b36b;--conf:#141414;
  --muted:#5b5b55;--on:#141414;
  --display:"Rozha One","Hind",Georgia,serif;
  --body:"Hind","Segoe UI",system-ui,sans-serif;
  --shadow:5px 5px 0 var(--ink);
}
*{box-sizing:border-box;margin:0}
html{color-scheme:light}
body{background-color:var(--paper);background-image:radial-gradient(rgba(20,20,20,.13) 1.2px,transparent 1.3px);background-size:22px 22px;
  color:var(--ink);font:500 17px/1.5 var(--body);height:100vh;display:flex;flex-direction:column}
button,input{font-family:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:20px;padding:14px 28px;background:var(--white);border-bottom:4px solid var(--ink);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand .dev{font:400 44px/1 var(--display);background:var(--yellow);border:3px solid var(--ink);border-radius:14px;padding:4px 14px 8px;box-shadow:4px 4px 0 var(--ink);transform:rotate(-2deg)}
.brand .lat{font:400 34px/1 var(--display);letter-spacing:-.5px}
header .tag{color:var(--muted);font-weight:600;flex:1;min-width:160px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:4px 14px;border-radius:999px;background:var(--white);border:2px solid var(--ink);font-size:15px;font-weight:600}
#live i{width:10px;height:10px;border-radius:50%;background:var(--low);border:2px solid var(--ink);animation:blink 1.4s steps(2,jump-none) infinite}
#live.off i{background:var(--critical);animation:none}
@keyframes blink{50%{opacity:.25}}
.stats{display:flex;gap:10px}
.stat{background:var(--white);border:3px solid var(--ink);border-radius:14px;padding:2px 14px 4px;box-shadow:3px 3px 0 var(--ink);display:flex;align-items:baseline;gap:8px}
.stat b{font:400 30px/1.15 var(--display);min-width:.6em;text-align:center}
.stat span{font-size:14px;font-weight:600;color:var(--muted)}

/* ---------- ticker ---------- */
#ticker{background:var(--ink);color:var(--yellow);overflow:hidden;white-space:nowrap;border-bottom:4px solid var(--ink);font-weight:600;font-size:16px}
#ticker .run{display:inline-block;padding:6px 0;animation:marquee 40s linear infinite}
#ticker .tk{display:inline-block;padding-right:56px;position:relative}
#ticker .tk::after{content:"";position:absolute;right:24px;top:50%;width:9px;height:9px;margin-top:-4px;background:var(--critical);transform:rotate(45deg)}
#ticker .tk b{color:var(--white)}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-16.6667%)}}

/* ---------- layout ---------- */
main{flex:1;display:grid;grid-template-columns:minmax(360px,440px) 1fr;gap:28px;padding:24px 28px 26px;min-height:0}
.booth{background:var(--yellow);border:4px solid var(--ink);border-radius:26px;box-shadow:8px 8px 0 var(--ink);display:flex;flex-direction:column;min-height:0;padding:18px 18px 18px}
.booth h2{font:400 30px/1.1 var(--display)}
.booth small{display:block;font:600 15px/1.3 var(--body);margin:2px 0 12px}
.board{display:flex;flex-direction:column;min-height:0}
.boardhead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.boardhead h2{font:400 36px/1.05 var(--display)}
.boardhead small{display:block;color:var(--muted);font:600 15px/1.3 var(--body);margin-top:2px}

/* ---------- conversation ---------- */
#chat{flex:1;overflow-y:auto;background:var(--white);border:3px solid var(--ink);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth;min-height:0}
.bub{max-width:88%;padding:9px 14px;border:2px solid var(--ink);border-radius:16px;font-size:18px;line-height:1.4;font-weight:500;animation:pop .22s ease-out}
.bub.user{align-self:flex-end;background:var(--ink);color:var(--white);border-bottom-right-radius:3px}
.bub.bot{align-self:flex-start;background:var(--soft);border-bottom-left-radius:3px;box-shadow:3px 3px 0 var(--ink)}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.hint{margin:auto;text-align:center;padding:10px 4px;max-width:380px}
.hint .big{font:400 28px/1.15 var(--display);margin-bottom:6px}
.hint p{color:var(--muted);font-weight:500;margin-bottom:14px}
.try{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.try button{background:var(--white);border:2px solid var(--ink);color:var(--ink);border-radius:12px;padding:6px 10px;font-size:15px;line-height:1.3;font-weight:600;cursor:pointer;text-align:left;box-shadow:3px 3px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.try button:hover{background:var(--yellow)}
.try button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}

.controls{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:12px}
#wave{width:100%;height:50px;display:block}
#mic{width:96px;height:96px;border-radius:30px;border:4px solid var(--ink);background:var(--ink);color:var(--yellow);cursor:pointer;position:relative;display:grid;place-items:center;
  box-shadow:6px 6px 0 var(--white),6px 6px 0 4px var(--ink);transition:transform .1s,box-shadow .1s,background .15s}
#mic svg{width:42px;height:42px}
#mic:hover:not(:disabled){background:#2b2b2b}
#mic:active:not(:disabled){transform:translate(5px,5px);box-shadow:0 0 0 var(--white),0 0 0 4px var(--ink)}
#mic:disabled{background:#8d8d86;border-color:#5b5b55;color:#d6d6cf;box-shadow:none;cursor:not-allowed}
#mic.listening{background:var(--critical);color:var(--white)}
#mic.listening::after{content:"";position:absolute;inset:-12px;border-radius:38px;border:4px solid var(--critical);animation:ring 1.1s infinite}
@keyframes ring{0%{transform:scale(.92);opacity:1}100%{transform:scale(1.25);opacity:0}}
#status{font-size:16px;font-weight:600;height:24px;display:flex;align-items:center;gap:8px}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--ink);animation:bounce 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
.typebox{display:flex;gap:8px;width:100%}
.typebox input{flex:1;min-width:0;background:var(--white);border:3px solid var(--ink);color:var(--ink);border-radius:14px;padding:9px 14px;font-size:16px;font-weight:500}
.typebox input::placeholder{color:#7a7a73}
.typebox input:focus{outline:none;box-shadow:4px 4px 0 var(--ink)}
button.sm{background:var(--white);color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:7px 15px;cursor:pointer;font-size:15px;font-weight:700;box-shadow:3px 3px 0 var(--ink);transition:transform .1s,box-shadow .1s,background .1s}
button.sm:hover:not(:disabled){background:var(--yellow)}
button.sm:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
button.sm:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
#send{background:var(--ink);color:var(--yellow)}
#send:hover:not(:disabled){background:#2b2b2b}
button.sm.danger:hover:not(:disabled){background:var(--critical);color:var(--white)}

/* ---------- tickets ---------- */
.seg{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.seg button{background:var(--white);border:2px solid var(--ink);color:var(--ink);border-radius:10px;padding:5px 16px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.seg button:hover{background:var(--yellow)}
.seg button.on{background:var(--ink);color:var(--yellow);transform:translate(3px,3px);box-shadow:none}
#feed{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;align-content:start;grid-auto-rows:max-content;padding:2px 10px 26px 2px}
.card{--c:var(--medium);background:var(--white);border:3px solid var(--ink);border-radius:18px;box-shadow:var(--shadow);position:relative;overflow:hidden;display:flex;flex-direction:column}
.card>*{flex-shrink:0}
.card .band{background:var(--c);color:var(--on);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 14px;border-bottom:3px solid var(--ink)}
.card.critical{--c:var(--critical);--on:#fff;box-shadow:5px 5px 0 var(--critical),5px 5px 0 3px var(--ink)}
.card.high{--c:var(--high)}.card.medium{--c:var(--medium)}.card.low{--c:var(--low)}
.card.conf{--c:var(--conf);--on:var(--yellow)}
.card.conf .band{background:var(--ink)}
.card.resolved{opacity:.55;filter:grayscale(1)}
.card.fresh{animation:drop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes drop{from{transform:translateY(-18px) rotate(-1.5deg);opacity:0}to{transform:none;opacity:1}}
.dept{font:400 19px/1.2 var(--display);display:inline-flex;align-items:center;gap:8px}
.dept .ic{font-size:20px}
.id{font:400 22px/1 var(--display)}
.card .body{padding:12px 14px 2px}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;padding:0 10px;font-size:14px;font-weight:700;text-transform:capitalize;background:var(--white);color:var(--ink)}
.badge::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c);border:2px solid var(--ink)}
.card.conf .badge::before{background:var(--yellow)}
.card.critical .badge::before{animation:blink 1s steps(2,jump-none) infinite}
.tag2{border:2px solid var(--ink);border-radius:8px;padding:0 8px;font-size:13px;font-weight:600;background:var(--white)}
.tag2.demo{background:#ffe48a}.tag2.ok{background:#b5ecce}
.sum{font-size:19px;font-weight:600;margin:10px 0 12px;line-height:1.35}
.meta{position:relative;border-top:3px dashed var(--ink);padding:10px 14px 12px;display:flex;gap:10px;align-items:center;font-size:15px;font-weight:600;margin-top:auto}
.meta::before,.meta::after{content:"";position:absolute;top:-11px;width:18px;height:18px;border-radius:50%;background:var(--paper);border:3px solid var(--ink)}
.meta::before{left:-12px}.meta::after{right:-12px}
.meta .sp{flex:1}
.meta button.sm{padding:3px 14px;font-size:14px;box-shadow:2px 2px 0 var(--ink)}
.meta button.sm:hover:not(:disabled){background:var(--low);color:var(--ink)}
.empty,.nomatch{grid-column:1/-1;text-align:center;color:var(--muted);font-weight:600;padding:36px 10px;border:3px dashed var(--ink);border-radius:18px;background:rgba(255,255,255,.6)}
.empty .big{font:400 26px var(--display);color:var(--ink);margin-bottom:4px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--yellow);font-weight:600;border:3px solid var(--ink);padding:10px 22px;border-radius:14px;display:none;box-shadow:5px 5px 0 var(--yellow);z-index:5}

@media(max-width:980px){
  body{height:auto;min-height:100vh}
  header{padding:12px 16px;gap:12px}
  .brand .dev{font-size:36px}.brand .lat{font-size:28px}
  header .tag{flex-basis:100%;order:5}
  .stats{order:4;flex-basis:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .stat{flex-direction:column;align-items:center;gap:0;padding:2px 4px 4px}
  .stat b{font-size:26px}.stat span{font-size:13px}
  main{grid-template-columns:minmax(0,1fr);padding:18px 14px 26px;gap:26px}
  .booth{padding:14px}
  #chat{min-height:240px;max-height:48vh}
  #feed{grid-template-columns:1fr;max-height:none;overflow:visible}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dev">आवाज़</span><span class="lat">Awaaz</span></div>
  <div class="tag">Speak it. We'll raise it.</div>
  <div class="stats">
    <div class="stat"><b id="s-open">0</b><span>Open</span></div>
    <div class="stat"><b id="s-crit" style="color:var(--critical)">0</b><span>Critical</span></div>
    <div class="stat"><b id="s-res" style="color:#12804a">0</b><span>Resolved</span></div>
    <div class="stat"><b id="s-tot">0</b><span>Total</span></div>
  </div>
  <span class="pill" id="live" title="Dashboard refreshes every 2 seconds"><i></i>Live</span>
  <span class="pill" id="lang">Language: auto</span>
</header>
<div id="ticker" aria-hidden="true"></div>
<main>
  <section class="booth">
    <h2>Talk to Awaaz</h2>
    <small>English, Hindi or Hinglish</small>
    <div id="chat"></div>
    <div class="controls">
      <canvas id="wave" aria-hidden="true"></canvas>
      <button id="mic" title="Click or press Space" aria-label="Start or stop recording">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/></svg>
      </button>
      <div id="status">Ready</div>
      <div class="typebox">
        <input id="txt" placeholder="or type your problem here..." autocomplete="off">
        <button class="sm" id="send">Send</button>
        <button class="sm" id="newc" title="Start a new conversation">New</button>
      </div>
    </div>
  </section>
  <section class="board">
    <div class="boardhead">
      <h2>Live tickets<small>Updates the moment someone speaks</small></h2>
      <span><button class="sm" id="export" style="margin-right:8px" onclick="location.href='/api/export.csv'">Export CSV</button><button class="sm danger" id="reset" title="Delete all tickets">Reset</button></span>
    </div>
    <div class="seg" id="seg">
      <button class="on" data-f="all">All</button><button data-f="open">Open</button><button data-f="critical">Critical</button><button data-f="resolved">Resolved</button>
    </div>
    <div id="feed"><div class="empty"><div class="big">No tickets yet</div>Speak a problem and it shows up here.</div></div>
  </section>
</main>
<div id="toast"></div>

<script>
let sessionId = crypto.randomUUID();
let recorder = null, chunks = [], busy = false, recTimer = null;
const $ = id => document.getElementById(id);
const mic = $("mic"), chat = $("chat"), statusEl = $("status");
const player = new Audio();   // one element, unlocked by the first tap, reused for every reply (needed on iPhone)
const SILENT = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=";
function unlockAudio(){ try { player.onended = player.onerror = null; player.src = SILENT; player.play().catch(() => {}); } catch (e) {} }

/* ---------- intro hint with tappable examples ---------- */
const EXAMPLES = ["My wifi is not working", "Hostel 5 ka wifi band hai", "Someone fainted at the ground", "Mess ka khana kharab hai"];
function hintHTML(title, text){
  return `<div class="hint"><div class="big">${title}</div><p>${text}</p><div class="try">` +
    EXAMPLES.map(x => `<button data-say="${x}">${x}</button>`).join("") + `</div></div>`;
}
chat.innerHTML = hintHTML("What's the problem?", "Press the mic (or Space) and speak. Or tap an example to see how it works.");
chat.addEventListener("click", e => {
  const b = e.target.closest("[data-say]");
  if (b && !busy){ $("txt").value = b.dataset.say; sendText(); }
});

/* ---------- live waveform ---------- */
const cv = $("wave"), cx = cv.getContext("2d");
let waveMode = "idle", analyser = null, actx = null, freq = null;
function fitCanvas(){ const r = devicePixelRatio || 1; cv.width = cv.clientWidth * r; cv.height = cv.clientHeight * r; }
addEventListener("resize", fitCanvas); fitCanvas();
function drawWave(t){
  const W = cv.width, H = cv.height, N = 40, gap = W / N, bw = Math.max(4, gap * .55), mid = H / 2;
  cx.clearRect(0, 0, W, H);
  if (waveMode === "listening" && analyser){ analyser.getByteFrequencyData(freq); }
  for (let i = 0; i < N; i++){
    let v;
    if (waveMode === "listening" && analyser) v = freq[Math.floor(i / N * freq.length * .7)] / 255;
    else if (waveMode === "speaking") v = .25 + .55 * Math.abs(Math.sin(t / 220 + i * .55) * Math.sin(t / 530 + i * .21));
    else if (waveMode === "thinking") v = .08 + .6 * Math.max(0, Math.sin(t / 260 - i * .35)) ** 3;
    else v = .06 + .05 * Math.sin(t / 900 + i * .5);
    const h = Math.max(5, v * H * .95);
    cx.fillStyle = waveMode === "listening" ? "#e8283a" : waveMode === "idle" ? "rgba(20,20,20,.35)" : "#141414";
    const x = i * gap + (gap - bw) / 2;
    cx.fillRect(x, mid - h / 2, bw, h);
  }
  requestAnimationFrame(drawWave);
}
requestAnimationFrame(drawWave);

function setStatus(s){
  waveMode = /^Listening/.test(s) ? "listening" : s === "Thinking" ? "thinking" : s === "Speaking" ? "speaking" : "idle";
  statusEl.innerHTML = s === "Thinking" ? 'Thinking <span class="dots"><span></span><span></span><span></span></span>' : s;
}
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  setTimeout(() => t.style.display = "none", 5000);
}
function bubble(text, who){
  const h = chat.querySelector(".hint"); if (h) h.remove();
  const d = document.createElement("div"); d.className = "bub " + who; d.textContent = text;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
}
function lock(on){ busy = on; mic.disabled = on; $("send").disabled = on; }

async function post(url, opts){
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 30000);
  try {
    const r = await fetch(url, {...opts, signal: ctl.signal});
    if (!r.ok) throw new Error("Server error " + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

/* ---------- recording ---------- */
async function startRec(){
  if (busy) return;
  unlockAudio();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}});
    const rec = new MediaRecorder(stream); recorder = rec; chunks = [];
    try {                                           // feeds the live waveform; the app works without it
      actx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = actx.createAnalyser(); analyser.fftSize = 128; analyser.smoothingTimeConstant = .75;
      actx.createMediaStreamSource(stream).connect(analyser);
      freq = new Uint8Array(analyser.frequencyBinCount);
    } catch (e) { analyser = null; }
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      clearTimeout(recTimer);
      try { if (actx) actx.close(); } catch (e) {} analyser = null; actx = null;
      sendAudio(new Blob(chunks, {type: rec.mimeType || "audio/webm"}), rec.mimeType || "audio/webm");
    };
    rec.start(); mic.classList.add("listening"); setStatus("Listening...");
    recTimer = setTimeout(stopRec, 30000);        // never record forever
  } catch (e) {
    toast("Microphone blocked. Type instead."); $("txt").focus();
  }
}
function stopRec(){
  if (recorder && recorder.state === "recording"){
    mic.classList.remove("listening"); setStatus("Thinking"); lock(true);
    const r = recorder; recorder = null;          // a second press can't stop it twice
    setTimeout(() => { if (r.state === "recording") r.stop(); }, 500);
  }
}
mic.onclick = () => (recorder && recorder.state === "recording") ? stopRec() : startRec();
document.addEventListener("keydown", e => {
  if (e.code === "Space" && document.activeElement.tagName !== "INPUT"){ e.preventDefault(); mic.click(); }
  if (e.ctrlKey && e.shiftKey && e.code === "KeyD"){ seed(); }
});

/* ---------- sending ---------- */
async function sendAudio(blob, mime){
  lock(true); setStatus("Thinking");
  const ext = /mp4|aac/.test(mime || "") ? "mp4" : /ogg/.test(mime || "") ? "ogg" : "webm";
  const fd = new FormData(); fd.append("audio", blob, "speech." + ext); fd.append("session_id", sessionId);
  try { handle(await post("/api/voice", {method:"POST", body:fd})); }
  catch (e){ console.error(e); toast("Failed: " + e.message); lock(false); setStatus("Ready"); }
}
async function sendText(){
  const v = $("txt").value.trim(); if (!v || busy) return; $("txt").value = "";
  unlockAudio();
  lock(true); setStatus("Thinking");
  try {
    handle(await post("/api/text", {method:"POST", headers:{"Content-Type":"application/json"},
                                    body: JSON.stringify({text:v, session_id:sessionId})}));
  } catch (e){ console.error(e); toast("Failed: " + e.message); lock(false); setStatus("Ready"); }
}
$("send").onclick = sendText;
$("txt").onkeydown = e => { if (e.key === "Enter") sendText(); };
$("newc").onclick = () => { sessionId = crypto.randomUUID(); chat.innerHTML = hintHTML("New conversation", "Go ahead, tell Awaaz what's wrong."); };

/* ---------- reply + voice ---------- */
function browserSpeak(text, lang, done){
  if (!("speechSynthesis" in window)) return done();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang === "hi" ? "hi-IN" : "en-IN";
  u.onend = u.onerror = done;
  speechSynthesis.speak(u);
}

async function handle(d){
  const done = () => { lock(false); setStatus("Ready"); };
  if (!d) { toast("Empty reply from server"); return done(); }
  try {
    if (d.transcript) bubble(d.transcript, "user");
    bubble(d.reply, "bot");
    if (d.lang) $("lang").textContent = "Language: " + d.lang.toUpperCase();
    loadTickets();
    setStatus("Speaking");

    let b64 = d.audio_b64;
    if (!b64){
      try {
        b64 = (await post("/api/tts", {method:"POST", headers:{"Content-Type":"application/json"},
               body: JSON.stringify({text: d.reply, lang: d.lang || "en"})})).audio_b64;
      } catch (e){ console.error(e); }
    }
    if (b64){
      player.onended = done;
      player.onerror = () => browserSpeak(d.reply, d.lang, done);
      player.src = "data:audio/mp3;base64," + b64;
      player.play().catch(() => browserSpeak(d.reply, d.lang, done));
    } else {
      browserSpeak(d.reply, d.lang, done);
    }
  } catch (e){ console.error(e); toast("Display error: " + e.message); done(); }
}

/* ---------- tickets ---------- */
const cards = new Map(); let firstLoad = true, filter = "all", tickerSig = "";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ICONS = {"Hostel":"🏠","IT/WiFi":"📶","Mess/Canteen":"🍽️","Academics":"🎓","Transport":"🚌","Library":"📚",
               "Sports":"🏸","Events/Clubs":"🎉","Health/Medical":"⚕️","Safety/Admin":"🛡️","Other":"📌"};
function ago(iso){
  if (!iso) return "";
  if (!/(Z|[+-]\d\d:\d\d)$/.test(iso)) iso += "Z";      // the server stores UTC
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return "just now"; if (s < 3600) return Math.floor(s/60) + " min ago";
  if (s < 86400) return Math.floor(s/3600) + " h ago"; return Math.floor(s/86400) + " d ago";
}
function setNum(el, n){
  const from = +el.textContent || 0;
  if (from === n){ el.textContent = n; return; }
  const t0 = performance.now();
  (function step(t){
    const p = Math.min(1, (t - t0) / 450);
    el.textContent = Math.round(from + (n - from) * p);
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}
function cardHTML(t){
  const conf = t.confidential;
  const icon = conf ? "🔒" : (ICONS[t.department] || "📌");
  return `<div class="band"><span class="dept"><span class="ic">${icon}</span>${conf ? "Confidential" : esc(t.department)}</span><span class="id">#${t.id}</span></div>
    <div class="body"><div class="row"><span class="badge">${esc(t.urgency)}</span>
    ${t.status === "resolved" ? '<span class="tag2">resolved</span>' : ""}
    ${t.report_count > 1 ? `<span class="tag2">x${t.report_count} reports</span>` : ""}
    ${(t.category || "").startsWith("[demo]") ? '<span class="tag2 demo">demo data</span>' : ""}
    ${t.emailed ? '<span class="tag2 ok">&#9993; notified</span>' : ""}
    ${t.deadline ? `<span class="tag2">due ${esc(t.deadline)}</span>` : ""}</div>
    <div class="sum">${conf ? "Confidential case" : esc(t.summary)}</div></div>
    <div class="meta"><span>${t.location && !conf ? "📍 " + esc(t.location) : ""}</span><span class="sp"></span>
    <span>${ago(t.created_at)}</span>
    ${t.status !== "resolved" ? `<button class="sm" onclick="resolveT(${t.id})">Resolve</button>` : ""}</div>`;
}
const nomatch = document.createElement("div"); nomatch.className = "nomatch";
function applyFilter(){
  let shown = 0;
  for (const [, el] of cards){
    const t = el._t, res = t.status === "resolved";
    const ok = filter === "all" || (filter === "open" && !res) ||
               (filter === "critical" && !res && t.urgency === "critical") || (filter === "resolved" && res);
    el.style.display = ok ? "" : "none"; if (ok) shown++;
  }
  if (cards.size && !shown){ nomatch.textContent = "No " + filter + " tickets right now."; $("feed").appendChild(nomatch); }
  else nomatch.remove();
}
$("seg").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  filter = b.dataset.f;
  [...$("seg").children].forEach(x => x.classList.toggle("on", x === b));
  applyFilter();
};
function updateTicker(list){                              // scrolling strip of the latest open tickets
  const open = list.filter(t => t.status !== "resolved").slice(0, 10);
  const items = open.length
    ? open.map(t => `<span class="tk"><b>#${t.id}</b> ${t.confidential ? "Confidential case" : esc(t.department) + ": " + esc(t.summary)}</span>`)
    : ['<span class="tk">Speak a problem and Awaaz raises it with the right department</span>'];
  const html = items.join("");
  if (html === tickerSig) return;                          // unchanged: don't restart the animation
  tickerSig = html;
  const run = document.createElement("div"); run.className = "run";
  run.innerHTML = html.repeat(6);
  run.style.animationDuration = Math.max(25, Math.round(html.length / 5)) + "s";
  $("ticker").replaceChildren(run);
}
async function loadTickets(){
  let list;
  try { list = await (await fetch("/api/tickets")).json(); $("live").classList.remove("off"); }
  catch { $("live").classList.add("off"); return; }
  const feed = $("feed");
  updateTicker(list);
  if (!list.length){
    feed.innerHTML = '<div class="empty"><div class="big">No tickets yet</div>Speak a problem and it shows up here.</div>'; cards.clear(); firstLoad = false;
    ["s-open","s-crit","s-res","s-tot"].forEach(id => setNum($(id), 0));
    return;
  }
  const e = feed.querySelector(".empty"); if (e) e.remove();
  const live = new Set(list.map(t => t.id));              // drop cards for tickets that no longer exist
  for (const [id, el] of cards) if (!live.has(id)){ el.remove(); cards.delete(id); }
  const sorted = [...list].sort((a,b) => (a.status==="resolved") - (b.status==="resolved") || b.id - a.id);
  sorted.forEach(t => {
    let el = cards.get(t.id);
    const cls = "card " + t.urgency + (t.confidential ? " conf" : "") + (t.status === "resolved" ? " resolved" : "");
    const html = cardHTML(t);
    if (!el){
      el = document.createElement("div"); cards.set(t.id, el);
      el.className = cls + (firstLoad ? "" : " fresh"); el.innerHTML = html; el._sig = html;
    } else if (el._sig !== html){
      el.className = cls; el.innerHTML = html; el._sig = html;
    }
    el._t = t;
    feed.appendChild(el);
  });
  firstLoad = false;
  applyFilter();
  const open = list.filter(t => t.status !== "resolved");
  setNum($("s-open"), open.length);
  setNum($("s-crit"), open.filter(t => t.urgency === "critical").length);
  setNum($("s-res"), list.length - open.length);
  setNum($("s-tot"), list.length);
}
async function resolveT(id){ await fetch(`/api/tickets/${id}/resolve`, {method:"POST"}); loadTickets(); }
async function resetAll(){
  if (!confirm("Delete ALL tickets? This cannot be undone.")) return;
  let pin = "";
  for (let attempt = 0; attempt < 2; attempt++){
    let r;
    try { r = await fetch("/api/reset", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({pin})}); }
    catch { toast("Reset failed: server not reachable"); return; }
    if (r.ok){ await loadTickets(); toast("All tickets deleted"); return; }
    if (r.status === 403 && attempt === 0){ pin = prompt("Enter the reset PIN"); if (pin === null) return; continue; }
    toast(r.status === 403 ? "Wrong PIN" : "Reset failed"); return;
  }
}
$("reset").onclick = resetAll;
async function seed(){ await fetch("/api/seed", {method:"POST"}); loadTickets(); toast("Demo tickets seeded"); }
loadTickets(); setInterval(loadTickets, 2000);
</script>
